# ESP32-S31 bounded hardware-validation profile.
#
# This profile extends the deployable port configuration with test
# applications and observability required by the automated smoke and soak
# suites. Do not use it as a production image profile.

#include "production.conf"

CONFIG_EXAMPLES_SV32TEST=y
CONFIG_EXAMPLES_SV32TEST_PROGNAME="sv32test"
CONFIG_EXAMPLES_SV32TEST_STACKSIZE=4096
CONFIG_EXAMPLES_E1NET=y
CONFIG_EXAMPLES_E1NET_PROGNAME="e1net"
CONFIG_EXAMPLES_E1NET_STACKSIZE=8192
CONFIG_EXAMPLES_BUSY=y
CONFIG_EXAMPLES_BUSY_PROGNAME="busy"
CONFIG_EXAMPLES_BUSY_PRIORITY=100
CONFIG_EXAMPLES_BUSY_STACKSIZE=2048
CONFIG_EXAMPLES_TLBSTRESS=y
CONFIG_EXAMPLES_TLBSTRESS_PROGNAME="tlbstress"
CONFIG_EXAMPLES_TLBSTRESS_PRIORITY=100
CONFIG_EXAMPLES_TLBSTRESS_STACKSIZE=4096
CONFIG_SCHED_CPULOAD_SYSCLK=y
CONFIG_SCHED_CPULOAD_TIMECONSTANT=2
CONFIG_STACK_COLORATION=y
